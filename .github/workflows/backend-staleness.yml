name: Backend Staleness Check

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  check-backends:
    if: ${{ secrets.QISKIT_IBM_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend staleness test
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          ORG_ID: ${{ secrets.ORG_ID }}
        run: |
          pytest tests/test_configured_backends_are_live.py -m requires_ibm --maxfail=1 -q
