apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ibm-cloud-secret-store
  namespace: jenkins-agents
spec:
  provider:
    ibm:
      service: ResourceController
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: ibm-cloud-eso-credentials
            key: apikey
      # The IBM Cloud account / region the secrets manager lives in
      region: us-east
---
apiVersion: v1
kind: Secret
metadata:
  name: ibm-cloud-eso-credentials
  namespace: jenkins-agents
type: Opaque
# Create this secret out-of-band and do not store the value in Git.
# Example:
# kubectl create secret generic ibm-cloud-eso-credentials \
#   -n jenkins-agents \
#   --from-literal=apikey='YOUR_IBM_CLOUD_API_KEY'
